<x-dc>
<helmet><style>
  @keyframes famNavSheen { 0%,20% { transform: translateX(-130%); } 65%,100% { transform: translateX(360%); } }
  @keyframes famNavIn { from { opacity: 0; transform: translateY(-14px) scale(.98); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  .fn-burger { display: none !important; }
  @media (max-width: 860px) { .fn-links { display: none !important; } .fn-burger { display: flex !important; } .fn-act { margin-left: auto; } }

  /* MOBILE UNIQUEMENT. Sur telephone, le libelle « Univers Beauté » est reduit a
     zero par son max-width calcule : il ne restait qu'une fleche, qui ne dit
     pas vers quel univers elle mene. On la remplace par le logo de l'univers
     cible : un halterre pour le Gym, une fleur de lotus pour le Spa.
     Une icone se lit a 18 px, ce qu'un logotype de 420x120 ne fait pas. */
  @media (max-width: 700px) {
    /* on masque la fleche mais pas l'icone : sans le :not(), le selecteur
       .fam-bascule svg est plus specifique que .fam-icone et gagne meme a
       !important egal, ce qui laissait le bouton vide. */
    .fam-bascule svg:not(.fam-icone) { display: none !important; }
    .fam-bascule .fam-icone { display: block !important; }
    .fam-bascule { padding: 9px !important; }
  }


  /* MOBILE UNIQUEMENT. Dans le menu deroulant, les entrees d'univers se
     noyaient parmi les liens de section. On les cible par leur adresse
     EXACTE, sans ancre : c'est ce qui distingue un changement d'univers
     d'un lien de section comme Gym-Fitness.dc.html#planning.
     Or pour Beaute-Spa, vert pour Gym, avec un filet lateral.
     Le bouton de bascule de la barre est exclu, il est deja identifie
     par le logo de l'univers cible. */
  @media (max-width: 700px) {
    header a[href="Spa-Beaute.dc.html"]:not(.fam-bascule),
    header a[href="Gym-Fitness.dc.html"]:not(.fam-bascule) {
      border-left: 3px solid currentColor !important;
      padding-left: 11px !important;
      font-weight: 700 !important;
    }
    header a[href="Spa-Beaute.dc.html"]:not(.fam-bascule)  { color: #C9A24A !important; }
    header a[href="Gym-Fitness.dc.html"]:not(.fam-bascule) { color: #CBF34A !important; }
  }
</style></helmet>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:80}}">class Component extends DCLogic {
  state = { theme: (typeof document !== "undefined" && document.documentElement.dataset.theme) || "dark" };
  toggleTheme = () => {
    const t = this.state.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("famous_theme", t); } catch (e) {}
    this.setState({ theme: t });
  };
  renderVals() {
    const o = !!this.state.menu;
    return { menuOpen: o, menuAria: o ? "true" : "false", toggleMenu: () => this.setState({ menu: !o }), closeMenu: () => this.setState({ menu: false }),
      bTop: o ? "translateY(5px) rotate(45deg)" : "none", bMid: o ? 0 : 1, bBot: o ? "translateY(-5px) rotate(-45deg)" : "none",
      toggleTheme: this.toggleTheme, isDark: this.state.theme !== "light", isLight: this.state.theme === "light" };
  }
}
</script>
